name: Deploy Next.js Frontend

on:
  push:
    branches: [ main, test ]

jobs:
  # ----------------------------------------------------
  # JOB 1: STAGING DEPLOYMENT (TARGETS TEST ACCOUNT)
  # ----------------------------------------------------
  deploy-test:
    if: github.ref_name == 'test'
    runs-on: ubuntu-latest
    environment: Test
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: 'web/package-lock.json'

    - name: Install and Build (Test Context)
      working-directory: ./web
      run: |
        echo "NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL || 'https://olympiad-api-test-arghhvfxdpc5etem.centralindia-01.azurewebsites.net' }}" > .env.production
        echo "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_dG91Y2hlZC1zcG9uZ2UtODQuY2xlcmsuYWNjb3VudHMuZGV2JA' }}" >> .env.production
        echo "CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY || 'sk_test_AXKTfH1tHmxHU1Lg2LmWGcpu9obgI2X7IREMUzLNIl' }}" >> .env.production
        echo "NEXT_PUBLIC_UMAMI_WEBSITE_ID=214afa07-b0be-4a8c-9ddd-d0188d9370f3" >> .env.production
        echo "NEXT_PUBLIC_SENTRY_DSN=https://0e37ab8c7ae94eb8b32158f1d65c607c@app.glitchtip.com/23697" >> .env.production
        npm ci
        npm run build
        mv .next/standalone/server.js .next/standalone/next-server.js
        node -e "const fs = require('fs'); fs.writeFileSync('.next/standalone/server.js', \`const http = require('http'); const pipe = process.env.PORT; process.env.PORT = '3000'; const orig = http.Server.prototype.listen; http.Server.prototype.listen = function(...args) { if (args[0] === 3000 || args[0] === '3000') { args[0] = pipe; if (typeof args[1] === 'string') { args.splice(1, 1); } } return orig.apply(this, args); }; require('./next-server.js');\`)"
        cp -r .next/static .next/standalone/.next/static
        cp -r public .next/standalone/public
        cp web.config .next/standalone/web.config

    - name: Azure Login (Test Account)
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy Frontend to Azure
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'olympiad-frontend-test'
        package: web/.next/standalone

  # ----------------------------------------------------
  # JOB 2: PRODUCTION DEPLOYMENT (TARGETS PROD ACCOUNT)
  # ----------------------------------------------------
  deploy-prod:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: Production
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: 'web/package-lock.json'

    - name: Install and Build (Production Context)
      working-directory: ./web
      run: |
        echo "NEXT_PUBLIC_API_URL=https://api.olympiadready.com" > .env.production
        echo "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_dG91Y2hlZC1zcG9uZ2UtODQuY2xlcmsuYWNjb3VudHMuZGV2JA' }}" >> .env.production
        echo "CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY || 'sk_test_dummy' }}" >> .env.production
        echo "NEXT_PUBLIC_UMAMI_WEBSITE_ID=214afa07-b0be-4a8c-9ddd-d0188d9370f3" >> .env.production
        echo "NEXT_PUBLIC_SENTRY_DSN=https://0e37ab8c7ae94eb8b32158f1d65c607c@app.glitchtip.com/23697" >> .env.production
        npm ci
        npm run build
        mv .next/standalone/server.js .next/standalone/next-server.js
        node -e "const fs = require('fs'); fs.writeFileSync('.next/standalone/server.js', \`const http = require('http'); const pipe = process.env.PORT; process.env.PORT = '3000'; const orig = http.Server.prototype.listen; http.Server.prototype.listen = function(...args) { if (args[0] === 3000 || args[0] === '3000') { args[0] = pipe; if (typeof args[1] === 'string') { args.splice(1, 1); } } return orig.apply(this, args); }; require('./next-server.js');\`)"
        cp -r .next/static .next/standalone/.next/static
        cp -r public .next/standalone/public
        cp web.config .next/standalone/web.config

    - name: Azure Login (Prod Account)
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy Frontend to Azure
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'olympiad-frontend-prod'
        package: web/.next/standalone