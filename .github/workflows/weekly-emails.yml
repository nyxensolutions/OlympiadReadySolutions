name: Weekly Emails Cron Job

on:
  schedule:
    # Runs at 00:00 every Sunday (UTC)
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows manual triggering from the GitHub UI

jobs:
  trigger-emails:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Weekly Emails API
        run: |
          curl -X POST "https://api.olympiadready.com/api/jobs/weekly-emails" \
            -H "Cron-Key: ${{ secrets.ADMIN_API_KEY }}" \
            -H "Content-Length: 0" \
            --fail
